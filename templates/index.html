<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주님의 응답</title>
  <style>
    body {
      font-family: 'Nanum Myeongjo', serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #f5f5f5;
    }
    header {
      background: #fce4ec;
      text-align: center;
      padding: 10px;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: white;
    }
    .message {
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
      max-width: 90%;
    }
    .user {
      background: #e0f7fa;
      color: #006064;
      align-self: flex-end;
    }
    .lord {
      background: #fce4ec;
      color: #880e4f;
      align-self: flex-start;
    }
    #inputArea {
      padding: 10px;
      background: #fff;
      display: flex;
      gap: 10px;
      border-top: 1px solid #ccc;
    }
    #questionInput {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }
    #sendBtn {
      padding: 10px 16px;
      font-size: 16px;
    }
    #musicControl {
      background: none;
      border: none;
      color: #880e4f;
      font-size: 16px;
      margin-top: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h2>✝️ 주님의 응답</h2>
    <button id="musicControl" onclick="playMusic()">🎵 음악 재생</button>
    <audio id="bgm" loop>
      <source src="/static/background.mp3" type="audio/mp3">
    </audio>
  </header>

  <div id="messages"></div>

  <div id="inputArea">
    <input type="text" id="questionInput" placeholder="고민을 입력해보세요..." />
    <button id="sendBtn" onclick="sendMessage()">전송</button>
  </div>

  <script>
    function scrollToBottom() {
      const msgBox = document.getElementById("messages");
      msgBox.scrollTop = msgBox.scrollHeight;
    }

    function typeText(text, element, index = 0) {
      if (index < text.length) {
        element.innerHTML += text.charAt(index);
        setTimeout(() => typeText(text, element, index + 1), 40);
        scrollToBottom();
      }
    }

    function sendMessage() {
      const input = document.getElementById("questionInput");
      const text = input.value.trim();
      if (!text) return;

      const userDiv = document.createElement("div");
      userDiv.className = "message user";
      userDiv.innerText = "🙏 " + text;
      document.getElementById("messages").appendChild(userDiv);
      scrollToBottom();

      fetch("/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: text })
      })
      .then(res => res.json())
      .then(data => {
        const lordDiv = document.createElement("div");
        lordDiv.className = "message lord";
        document.getElementById("messages").appendChild(lordDiv);
        typeText("✝️ " + data.answer, lordDiv);
        scrollToBottom();
      });

      input.value = "";
    }

    function playMusic() {
      document.getElementById("bgm").play();
      document.getElementById("musicControl").innerText = "🎵 음악 재생 중";
    }
  </script>
</body>
</html>
