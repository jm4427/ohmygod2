<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주님의 응답 - 대화</title>
  <style>
    body {
      margin: 0;
      background-color: #121212;
      color: #eee;
      font-family: 'Nanum Myeongjo', serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .jesus-img {
      width: 90px;
      display: block;
      margin: 10px auto 4px;
      border-radius: 10px;
      opacity: 0.9;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 20px 20px;
    }
    .message {
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
      max-width: 90%;
    }
    .user {
      background: #263238;
      color: #aeea00;
      align-self: flex-end;
      text-align: right;
    }
    .lord {
      background: #4e342e;
      color: #ffe0b2;
      align-self: flex-start;
      text-align: left;
    }
    #inputArea {
      padding: 10px;
      background: #1e1e1e;
      display: flex;
      gap: 10px;
      border-top: 1px solid #333;
    }
    #questionInput {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      background: #2c2c2c;
      color: white;
      border: none;
    }
    #sendBtn {
      padding: 10px 16px;
      font-size: 16px;
      background: #6a1b9a;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <img src="/static/jesus.png" alt="Jesus" class="jesus-img" />
  <div id="messages"></div>
  <div id="inputArea">
    <input type="text" id="questionInput" placeholder="기도를 입력하세요..." />
    <button id="sendBtn" onclick="sendMessage()">전송</button>
  </div>

  <script>
    function scrollToBottom() {
      const msgBox = document.getElementById("messages");
      msgBox.scrollTop = msgBox.scrollHeight;
    }

    function typeText(text, element, index = 0) {
      if (index < text.length) {
        element.innerHTML += text.charAt(index);
        setTimeout(() => typeText(text, element, index + 1), 40);
        scrollToBottom();
      }
    }

    function sendMessage() {
      const input = document.getElementById("questionInput");
      const text = input.value.trim();
      if (!text) return;

      const userDiv = document.createElement("div");
      userDiv.className = "message user";
      userDiv.innerText = "🙏 " + text;
      document.getElementById("messages").appendChild(userDiv);
      scrollToBottom();

      fetch("/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: text })
      })
      .then(res => res.json())
      .then(data => {
        const lordDiv = document.createElement("div");
        lordDiv.className = "message lord";
        document.getElementById("messages").appendChild(lordDiv);
        typeText("✝️ " + data.answer, lordDiv);
        scrollToBottom();
      });

      input.value = "";
    }
  </script>
</body>
</html>
