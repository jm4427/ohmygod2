<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>주님의 응답</title>
  <style>
    body {
      font-family: '맑은 고딕', sans-serif;
      background-color: #f9f9f9;
      margin: 0; padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      background-color: #fce4ec;
      width: 100%;
      text-align: center;
      padding: 1rem 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { margin: 0; font-size: 1.5rem; }
    header a { margin: 0 10px; text-decoration: none; color: #555; font-weight: bold; }

    #chat-container {
      width: 100%;
      max-width: 700px;
      padding: 1rem;
      box-sizing: border-box;
      overflow-y: auto;
      flex-grow: 1;
    }

    .message {
      margin: 0.5rem 0;
      padding: 0.7rem;
      border-radius: 8px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .user {
      background-color: #e3f2fd;
      align-self: flex-end;
      text-align: right;
    }

    .lord {
      background-color: #ede7f6;
      align-self: flex-start;
      text-align: left;
    }

    form {
      display: flex;
      justify-content: center;
      width: 100%;
      max-width: 700px;
      margin: 1rem;
    }

    input[type="text"] {
      flex-grow: 1;
      padding: 0.6rem;
      font-size: 1rem;
    }

    button {
      padding: 0.6rem 1rem;
      font-size: 1rem;
    }

    .lord-image {
      width: 100px;
      margin: 10px auto;
      display: block;
    }

    audio {
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>✝️ 주님의 응답</h1>
    <a href="/static/qt.html">📘 오늘의 QT</a>
    <a href="/static/calendar.html">🗓️ QT 달력</a><br>
    <audio controls autoplay>
      <source src="/static/background.mp3" type="audio/mp3">
      경건한 배경 음악
    </audio>
  </header>

  <img src="/static/jesus.png" alt="Jesus" class="lord-image"/>

  <div id="chat-container"></div>

  <form id="chat-form">
    <input type="text" id="question" placeholder="고민을 입력해보세요..." required />
    <button type="submit">전송</button>
  </form>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('question');

    function appendMessage(text, sender) {
      const msg = document.createElement('div');
      msg.className = 'message ' + sender;
      msg.textContent = text;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function typeMessage(text, sender) {
      const msg = document.createElement('div');
      msg.className = 'message ' + sender;
      chatContainer.appendChild(msg);
      let i = 0;
      function typeChar() {
        if (i < text.length) {
          msg.textContent += text[i++];
          chatContainer.scrollTop = chatContainer.scrollHeight;
          setTimeout(typeChar, 80);
        }
      }
      typeChar();
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const q = input.value;
      appendMessage(q, 'user');
      input.value = '';
      const res = await fetch("/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q })
      });
      const data = await res.json();
      await typeMessage(data.answer, 'lord');
    };
  </script>
</body>
</html>
