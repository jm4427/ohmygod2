<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>주님의 응답</title>
  <style>
    body {
      margin: 0;
      font-family: 'Nanum Myeongjo', serif;
      background-color: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #1c1c1c;
      padding: 10px;
      text-align: center;
      color: #fff;
      border-bottom: 1px solid #444;
    }
    h1 {
      font-size: 1.6rem;
      margin: 0;
    }
    nav {
      margin-top: 8px;
    }
    nav a {
      color: #ccc;
      margin: 0 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
    }
    nav a:hover {
      color: #fff;
    }
    #verse {
      margin-top: 10px;
      font-style: italic;
      font-size: 0.9rem;
      color: #bbb;
    }
    #content {
      flex-grow: 1;
      border: none;
      width: 100%;
      height: 100%;
    }
    #audio-control {
      margin-top: 6px;
    }
    button {
      background-color: #2e2e2e;
      color: #ccc;
      border: 1px solid #444;
      padding: 6px 10px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover {
      background-color: #444;
    }
    @media (max-width: 600px) {
      nav a {
        display: block;
        margin: 6px 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>🙏 주님의 응답</h1>
    <nav>
      <a href="/static/chat.html" target="mainframe">💬 대화</a>
      <a href="/static/qt.html" target="mainframe">📘 오늘의 QT</a>
      <a href="/static/calendar.html" target="mainframe">🗓️ QT 달력</a>
    </nav>
    <div id="verse">📖 오늘의 말씀: <span id="dailyVerse">로딩 중...</span></div>
    <div id="audio-control">
      <audio id="bgm" loop>
        <source src="/static/background.mp3" type="audio/mp3">
      </audio>
      <button onclick="document.getElementById('bgm').play()">🎵 음악 재생</button>
    </div>
  </header>

  <iframe id="content" name="mainframe" src="/static/chat.html"></iframe>

  <script>
    document.addEventListener("click", () => {
      document.getElementById("bgm").play();
    }, { once: true });

    fetch("/qt-data")
      .then(res => res.json())
      .then(data => {
        if (Array.isArray(data) && data.length > 0) {
          const random = data[Math.floor(Math.random() * data.length)];
          document.getElementById("dailyVerse").innerText = random.verse || random;
        } else {
          document.getElementById("dailyVerse").innerText = "말씀을 가져오지 못했습니다.";
        }
      })
      .catch(() => {
        document.getElementById("dailyVerse").innerText = "말씀을 가져오는 중 오류 발생";
      });
  </script>
</body>
</html>
